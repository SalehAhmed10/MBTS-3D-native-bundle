<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>MBTS Avatar Embed</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      #avatar {
        width: 100%;
        height: 100%;
        background-color: transparent;
        background-repeat: no-repeat;
        background-position: center center;
        background-size: cover;
        overflow: hidden;
      }

      #avatar::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.12), transparent 42%),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02) 45%, rgba(255, 255, 255, 0.10));
      }

      #status {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(18, 24, 38, 0.72);
        color: #ffffff;
        font-size: 13px;
        line-height: 1.35;
        backdrop-filter: blur(8px);
      }

      #status[data-state="ready"] {
        display: none;
      }

      #status[data-state="error"] {
        background: rgba(127, 29, 29, 0.88);
      }
    </style>
  </head>
  <body>
    <main id="stage">
      <div id="avatar"></div>
      <div id="status" data-state="loading">Loading avatar runtime...</div>
    </main>
    <!-- Polyfill: Android WebView blocks fetch() for file:// URIs; XHR works with allowFileAccessFromFileURLs -->
    <script>
      (function () {
        if (typeof window === 'undefined' || typeof window.location === 'undefined') return;
        if (!window.location.href.startsWith('file://')) return;

        var _nativeFetch = window.fetch.bind(window);

        window.fetch = function (input, init) {
          var url = typeof input === 'string' ? input : (input && input.url ? input.url : String(input));
          if (!url.startsWith('file://')) return _nativeFetch(input, init);

          return new Promise(function (resolve, reject) {
            var xhr = new XMLHttpRequest();
            xhr.open((init && init.method) || 'GET', url, true);
            xhr.responseType = 'arraybuffer';

            if (init && init.headers) {
              var headers = init.headers;
              if (headers.forEach) {
                headers.forEach(function (v, k) { xhr.setRequestHeader(k, v); });
              } else {
                Object.keys(headers).forEach(function (k) { xhr.setRequestHeader(k, headers[k]); });
              }
            }

            xhr.onload = function () {
              var status = xhr.status === 0 ? 200 : xhr.status;
              var buf = xhr.response;
              var body = buf instanceof ArrayBuffer ? buf : new ArrayBuffer(0);
              resolve(new Response(body, {
                status: status,
                headers: { 'Content-Type': xhr.getResponseHeader('Content-Type') || '' }
              }));
            };

            xhr.onerror = function () { reject(new TypeError('fetch failed: ' + url)); };
            xhr.onabort = function () { reject(new DOMException('Aborted', 'AbortError')); };

            xhr.send(init && init.body ? init.body : null);
          });
        };
      })();
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
